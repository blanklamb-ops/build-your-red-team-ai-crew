# Empire Advisor Scoring Rules
# Each rule evaluates operator commands for OPSEC impact
# Severity: critical (block advisory), high (warn), medium (info), low (log)

rules:
  - id: R001
    name: "Unencrypted credential dump"
    pattern: "mimikatz.*sekurlsa::logonpasswords"
    rationale: "Plain mimikatz invocation generates high-fidelity EDR alerts; credentials often logged unencrypted"
    severity: critical
    category: credential_access

  - id: R002
    name: "PowerShell download cradle - Net.WebClient"
    pattern: "(Net\\.WebClient|WebClient.*DownloadString|DownloadFile)"
    rationale: "Net.WebClient download cradles are heavily signatured; PowerShell script block logging captures full payload URL"
    severity: high
    category: execution

  - id: R003
    name: "Invoke-Mimikatz in-memory"
    pattern: "Invoke-Mimikatz"
    rationale: "AMSI scans in-memory PowerShell; Invoke-Mimikatz triggers behavioral detection"
    severity: critical
    category: credential_access

  - id: R004
    name: "PowerSploit default module name"
    pattern: "Invoke-(DllInjection|Shellcode|WmiCommand|TokenManipulation)"
    rationale: "Default PowerSploit function names are widely signatured"
    severity: high
    category: execution

  - id: R005
    name: "WMI process creation"
    pattern: "Invoke-WmiMethod.*Win32_Process"
    rationale: "WMI process creation generates Security event 4688 and Sysmon event 1 with parent WMI Provider Host"
    severity: medium
    category: execution

  - id: R006
    name: "PsExec lateral movement"
    pattern: "psexec(\\.exe)?\\s"
    rationale: "PsExec creates named pipe \\pipe\\psexecsvc and service installation events; heavily monitored"
    severity: high
    category: lateral_movement

  - id: R007
    name: "Unobfuscated PowerShell IEX"
    pattern: "\\bIEX\\b|Invoke-Expression"
    rationale: "IEX/Invoke-Expression triggers script block logging and AMSI scanning; clear indicator of staged execution"
    severity: medium
    category: execution

  - id: R008
    name: "Registry persistence - Run key"
    pattern: "HKCU.*\\\\CurrentVersion\\\\Run"
    rationale: "Run key modifications logged by Sysmon event 13; common persistence location heavily monitored"
    severity: medium
    category: persistence

  - id: R009
    name: "Scheduled task creation via schtasks"
    pattern: "schtasks.*\\/create"
    rationale: "schtasks.exe invocation generates process creation and Security event 4698; scheduled task persistence is high-visibility"
    severity: high
    category: persistence

  - id: R010
    name: "Network port scan via PowerShell"
    pattern: "Test-NetConnection.*-Port|New-Object.*Net\\.Sockets\\.TcpClient"
    rationale: "Rapid sequential Test-NetConnection or socket creation generates network anomalies and process telemetry"
    severity: low
    category: discovery

  - id: R011
    name: "Active Directory reconnaissance - net group"
    pattern: "net\\s+(group|user)\\s+.*\\/domain"
    rationale: "net.exe domain queries generate LDAP traffic and command-line logging; common recon pattern"
    severity: medium
    category: discovery

  - id: R012
    name: "Bloodhound SharpHound default collector"
    pattern: "SharpHound.*-CollectionMethod\\s+All"
    rationale: "SharpHound generates high-volume LDAP queries, creates ZIP artifacts, and triggers behavioral alerts"
    severity: critical
    category: discovery
